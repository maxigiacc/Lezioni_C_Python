<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Presenze Studenti</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h1 class="mb-4">Presenze Studenti</h1>

  <form action="/add" method="POST" class="row g-3 mb-4">
    <div class="col-md-3">
      <input type="text" name="nome" class="form-control" placeholder="Nome" required>
    </div>
    <div class="col-md-3">
      <input type="text" name="cognome" class="form-control" placeholder="Cognome" required>
    </div>
    <div class="col-md-3">
      <input type="date" name="data" class="form-control" required>
    </div>
    <div class="col-md-3">
      <button type="submit" class="btn btn-primary w-100">Aggiungi Presenza</button>
    </div>
  </form>

  <form method="GET" action="/" class="row g-3 mb-4">
  <div class="col-md-3">
    <input type="date" name="data" value="{{ data_filter }}" class="form-control" placeholder="Filtra per data">
  </div>
  <div class="col-md-3">
    <button type="submit" class="btn btn-secondary w-100">Filtra</button>
  </div>
  <div class="col-md-3">
    <a href="/download{% if data_filter %}?data={{ data_filter }}{% endif %}" class="btn btn-success w-100">Download CSV</a>
  </div>
</form>


  <table class="table table-bordered table-hover bg-white">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Nome</th>
        <th>Cognome</th>
        <th>Data</th>
        <th>Azioni</th>
      </tr>
    </thead>
    <tbody>
      {% for p in presenze %}
      <tr>
        <td>{{ loop.index0 }}</td>
        <td>{{ p.nome }}</td>
        <td>{{ p.cognome }}</td>
        <td>{{ p.data }}</td>
        <td>
          <a href="/delete/{{ loop.index0 }}" class="btn btn-danger btn-sm">Elimina</a>
        </td>
      </tr>
      {% else %}
      <tr>
        <td colspan="5" class="text-center">Nessuna presenza registrata.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

</body>
</html>
